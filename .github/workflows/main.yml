name: Generate library from taxonomy

on:
  push:
    branches: [v1-with-data-api]
    paths:
      - 'taxonomy/structure/**'
      - 'taxonomy/items/**'
  workflow_dispatch:

jobs:
  build-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate library files
        run: |
          rm -rf library
          mkdir -p library

          for struct_file in taxonomy/structure/*.json; do
            base=$(basename "$struct_file" .json)
            mkdir -p "library/$base"

            # Read each taxonomy_N entry from the structure JSON
            count=$(jq 'length' "$struct_file")
            for i in $(seq 1 "$count"); do
              key="taxonomy_$i"
              item=$(jq -r ".$key.item" "$struct_file")

              src="taxonomy/items/$base/$item.yml"
              dest="library/$base/${i}_${item}.yml"

              if [ -f "$src" ]; then
                cp "$src" "$dest"
                echo "Created $dest from $src"
              else
                echo "Warning: $src not found, skipping"
              fi
            done
          done

          echo "---"
          find library -type f | sort

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard library)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git add library
          git commit -m "Generate library from taxonomy structure"
          git push origin v1-with-data-api
